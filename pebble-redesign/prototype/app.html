<title>조약돌</title>
<meta name="theme-color" content="#F5F2EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   조약돌 · Hi-fi prototype v2 "Candy pebbles"
   Visual direction: 크림 바탕 위의 파스텔 벤토 타일과 알록달록한 조약돌.
   - 화면은 색이 다른 타일(벤토)로 나눈다. 타일 하나 = 정보 한 덩어리.
   - 가장 중요한 행동은 항상 검은색(검은 돌, 검은 버튼). 색은 구역을 나누고 즐거움을 주는 데 쓴다.
   - 제목은 굵은 한글 세리프(Hahmlet), 본문은 IBM Plex Sans KR. 글자는 크게, 대비는 높게.
   Layout: 데스크톱은 [폰 | 시연 패널], 폰 너비에서는 앱이 화면 전체를 쓴다.
   ───────────────────────────────────────────────────────────── */
:root{
  --stage:#EAE5DB; --stage-ink:#1D1B21; --stage-ink-2:#68646E; --stage-line:#D6CFC2; --stage-card:#F6F2EA;
  --bg:#F5F2EA; --card:#FFFFFF; --ink:#17161A; --ink-2:#4A4751; --ink-3:#67636E; --line:#E6E0D4; --line-2:#CFC7B8;
  --lav:#CDBDF6; --lav-bg:#ECE5FD;
  --pink:#F7AECB; --pink-bg:#FDE5EF; --pink-d:#A3285C;
  --lime:#D2E77C; --lime-bg:#EEF5CF;
  --sun:#F8D35C; --sun-bg:#FDF0C4;
  --orange:#F6A46E; --orange-bg:#FDE2D0;
  --sky:#AFD4F0; --sky-bg:#E0EEF9;
  --mint:#A6DEC6;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --fs:1; --sb:48px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#121114; --stage-ink:#EEEAE2; --stage-ink-2:#A39EA8; --stage-line:#2C2A30; --stage-card:#1C1B20; color-scheme:dark}}
:root[data-theme="dark"]{--stage:#121114; --stage-ink:#EEEAE2; --stage-ink-2:#A39EA8; --stage-line:#2C2A30; --stage-card:#1C1B20; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--stage-ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}

/* ── stage ───────────────────────────────────────── */
.stage{min-height:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px 56px;padding-block:20px}
.device{width:calc(390px * var(--k,1) + 24px);height:calc(844px * var(--k,1) + 24px);padding:12px;border-radius:calc(54px * var(--k,1) + 12px);background:#141317;box-shadow:0 30px 70px -24px rgba(30,24,16,.45),inset 0 0 0 1.5px #34313A;flex:none}
.viewport{width:calc(390px * var(--k,1));height:calc(844px * var(--k,1));border-radius:calc(44px * var(--k,1));overflow:hidden;position:relative}

/* ── app shell ───────────────────────────────────── */
.app{word-break:keep-all;overflow-wrap:anywhere;position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--k,1));transform-origin:0 0;background:var(--bg);color:var(--ink);overflow:hidden;font-size:calc(15px * var(--fs));line-height:1.5;letter-spacing:-.01em}
.app.large{--fs:1.1}
.statusbar{position:absolute;inset:0 0 auto 0;height:var(--sb);display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-weight:600;font-size:15px;z-index:30;pointer-events:none;font-variant-numeric:tabular-nums}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.statusbar .sys i{display:block;background:var(--ink);border-radius:2px}
.host{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--bg);will-change:transform,opacity}
.screen::-webkit-scrollbar{display:none}
.screen::before{content:'';display:block;position:sticky;top:0;height:var(--sb);margin-bottom:calc(-1 * var(--sb));background:inherit;z-index:5}
.pad{min-height:100%;padding:calc(var(--sb) + 6px) 16px 118px;display:flex;flex-direction:column}
.no-tabs .pad{padding-bottom:24px}

/* floating tab bar */
.tabbar{position:absolute;left:50%;bottom:18px;width:236px;height:64px;margin-left:-118px;padding:6px;border-radius:32px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:4px;z-index:20;box-shadow:0 14px 30px -12px rgba(23,22,26,.55);transition:transform .45s var(--ease),opacity .3s}
.tabbar.hidden{transform:translateY(150%);opacity:0;pointer-events:none}
.tab{border:0;background:none;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;color:#A9A4AF;min-height:44px;transition:background .25s,color .25s}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{background:#FFFFFF;color:var(--ink)}

/* type */
.kicker{margin:0;font-size:calc(13px * var(--fs));font-weight:600;color:var(--ink-2)}
.display{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.025em;line-height:1.24;text-wrap:balance}
.title{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(28px * var(--fs));letter-spacing:-.025em}
.caption{margin:0;color:var(--ink-2);font-size:calc(14.5px * var(--fs));text-wrap:balance}
.hint{margin:0;color:var(--ink-3);font-size:calc(13.5px * var(--fs))}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{width:100%;min-height:58px;border:0;border-radius:20px;font-weight:700;font-size:calc(16.5px * var(--fs));display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),opacity .2s,background .2s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:disabled{background:var(--line-2);color:#fff}
.btn-quiet{background:var(--card);color:var(--ink)}
.icon-btn{width:44px;height:44px;border:0;background:var(--card);border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:22px;height:22px}
.bottom{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px}
.bottom.stick{position:sticky;bottom:0;margin-inline:-16px;padding:22px 16px 4px;background:linear-gradient(to bottom,transparent,var(--pbg,var(--bg)) 36%)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:12px;margin-bottom:12px}
.top .who{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:calc(24px * var(--fs));letter-spacing:-.02em}

/* ── bento ──────────────────────────────────────── */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:span 2}
.tile{position:relative;border:0;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ink);overflow:hidden;min-width:0;transition:transform .14s var(--ease)}
button.tile:active{transform:scale(.98)}
.tile .t-k{font-size:calc(13px * var(--fs));font-weight:600;color:var(--ink-2)}
.tile .t-h{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(21px * var(--fs));line-height:1.25;letter-spacing:-.02em}
.tile .t-b{margin:0;font-size:calc(14px * var(--fs));color:var(--ink-2)}
.tile .t-big{font-size:calc(34px * var(--fs));font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile .t-big small{font-size:calc(16px * var(--fs));color:var(--ink-2);font-weight:600}
.tile .go{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
.tile .go svg{width:18px;height:18px}
.c-lav{background:var(--lav)} .c-pink{background:var(--pink)} .c-lime{background:var(--lime)} .c-sun{background:var(--sun)} .c-orange{background:var(--orange)} .c-sky{background:var(--sky)} .c-mint{background:var(--mint)}
.c-white{background:var(--card)} .c-ink{background:var(--ink);color:#fff} .c-ink .t-k,.c-ink .t-b{color:#C9C4CF}
.c-rest{background:#ECE6DA}
.sticker{position:absolute;font-size:12.5px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:4px 10px;transform:rotate(-6deg)}

/* ── stones ─────────────────────────────────────── */
.cairn{display:block;overflow:visible}
.cairn .st{transform-box:fill-box;transform-origin:50% 100%}
.cairn .ghost{fill:rgba(255,255,255,.35);stroke:rgba(23,22,26,.28);stroke-width:1;stroke-dasharray:3 3}
.cairn-shadow{fill:rgba(23,22,26,.12)}
.cairn .glow{fill:#fff;opacity:0}
.stone-btn{position:relative;width:236px;height:168px;border:0;background:none;padding:0;display:grid;place-items:center;transition:transform .16s var(--ease);-webkit-tap-highlight-color:transparent;margin:0 auto}
.stone-btn:active:not(:disabled){transform:scale(.965)}
.stone-btn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stone-btn .sb-shadow{fill:rgba(23,22,26,.32);filter:blur(10px)}
.stone-btn .sb-label{position:relative;color:#fff;font-weight:700;font-size:calc(23px * var(--fs));letter-spacing:-.02em}
.stone-btn .sb-label small{display:block;font-size:12.5px;font-weight:500;color:#CFCAD4;margin-top:2px;text-align:center}
.stone-btn.rest .sb-label{color:var(--ink-2);font-size:calc(17px * var(--fs));font-weight:600}
.ripple{position:absolute;left:50%;top:50%;width:226px;height:160px;margin:-80px 0 0 -113px;border-radius:50%;border:2px solid var(--ink);pointer-events:none;opacity:0}

/* ── today ──────────────────────────────────────── */
.hero-tile{padding:20px 18px 18px;gap:2px}
.hero-tile .stone-btn{margin:14px auto 10px}
.hero-tile .t-b{text-align:center}
.time-chip{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;background:rgba(255,255,255,.72);border-radius:999px;padding:5px 11px;font-size:calc(13px * var(--fs));font-weight:600;font-variant-numeric:tabular-nums}
.mine{display:inline-flex;gap:6px;align-items:center;font-size:calc(13px * var(--fs));color:var(--ink-2);margin-top:6px}
.mine b{background:var(--sun);color:var(--ink);font-weight:700;border-radius:8px;padding:2px 8px}

/* ── gate ───────────────────────────────────────── */
.gate{background:var(--pbg)}
.gate-top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.gate-state{display:inline-flex;align-items:center;gap:8px;font-size:calc(13.5px * var(--fs));font-weight:700;background:var(--card);border-radius:999px;padding:7px 13px}
.gate-state .pulse{width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 0 rgba(23,22,26,.35);animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(23,22,26,0)}100%{box-shadow:0 0 0 0 rgba(23,22,26,0)}}
.prog{display:flex;gap:5px}
.prog i{width:26px;height:6px;border-radius:3px;background:rgba(23,22,26,.16);transition:background .3s}
.prog i.on{background:var(--ink)}
.gate .lead{margin:28px 0 10px}
.q-display{font-size:calc(30px * var(--fs));line-height:1.26;margin:0 0 4px}
.q-ref{margin:20px 0 6px;font-size:calc(14px * var(--fs));color:var(--ink-2)}
.q-ref b{background:#fff;border-radius:8px;padding:2px 8px;font-weight:700;color:var(--ink)}
.opts{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{width:100%;min-height:64px;border:2px solid transparent;background:var(--card);border-radius:22px;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left;font-size:calc(17px * var(--fs));font-weight:600;transition:border-color .2s,transform .12s var(--ease);box-shadow:0 1px 0 rgba(23,22,26,.06)}
.opt:active{transform:scale(.985)}
.opt .idx{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink);background:var(--oc)}
.opt .opt-tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink);background:var(--sun);border-radius:8px;padding:3px 8px;white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .idx{background:var(--ink);color:#fff}
.gate .hint{margin-top:16px;color:var(--ink-2)}

/* ── done ───────────────────────────────────────── */
.done-hero{align-items:center;text-align:center;padding:26px 18px 22px}
.check{width:64px;height:64px}
.check circle{fill:#fff;stroke:var(--ink);stroke-width:2.4;stroke-dasharray:170;stroke-dashoffset:170;animation:draw .7s var(--ease) .05s forwards}
.check path{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44;animation:draw .42s var(--ease) .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done-hero .display{font-size:calc(32px * var(--fs));margin-top:10px}
.done-time{margin:2px 0 0;font-size:calc(15px * var(--fs));color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.done-time b{color:var(--ink)}
.get{align-items:center;padding:20px 16px 16px;gap:8px}
.get-line{margin:0;font-size:calc(15px * var(--fs));font-weight:600;text-align:center}
.get-line b{font-variant-numeric:tabular-nums}
.land{fill:none;stroke:var(--ink);stroke-width:1.6;opacity:0}
.fu{animation:fu .6s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}

/* result */
.result{background:var(--card);border-radius:28px;padding:18px 18px 16px}
.result .rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:calc(13px * var(--fs));font-weight:600;color:var(--ink-2)}
.result h3{margin:8px 0 16px;font-family:var(--f-display);font-weight:700;font-size:calc(20px * var(--fs));line-height:1.35;letter-spacing:-.02em}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
.bar-label{display:flex;align-items:center;gap:6px;font-size:calc(15px * var(--fs));font-weight:500;margin-bottom:6px}
.bar-label .txt{flex:1;min-width:0}
.bar-label .pct{font-variant-numeric:tabular-nums;font-weight:700;min-width:42px;text-align:right}
.track{height:12px;border-radius:6px;background:#F1EDE5;overflow:hidden}
.track i{display:block;height:100%;width:var(--w);border-radius:6px;background:var(--bc);transform-origin:0 50%}
.bar.is-top .bar-label{font-weight:700}
.tag{flex:none;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 7px;white-space:nowrap}
.tag.a{background:var(--sun);color:var(--ink)}
.tag.g{background:var(--ink);color:#fff}
.tag.rank{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.verdict{margin:16px 0 0;padding:12px 14px;border-radius:16px;font-size:calc(14.5px * var(--fs));font-weight:700;display:flex;align-items:center;gap:10px;background:#F4F0E8}
.verdict.diff{background:var(--sun-bg)}
.verdict.same{background:var(--lime-bg)}
.verdict i{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}

/* ── pebbles ────────────────────────────────────── */
.pile{align-items:center;padding:22px 18px 20px}
.pile .t-big{margin-top:10px;font-size:calc(42px * var(--fs))}
.mini-towers{display:flex;gap:2px;align-items:flex-end;margin-top:6px;min-height:24px}
.list{background:var(--card);border-radius:28px;padding:6px 18px}
.list h2{margin:14px 0 2px;font-size:calc(14px * var(--fs));font-weight:700}
.rows{list-style:none;margin:0;padding:0}
.rowi{width:100%;display:flex;align-items:center;gap:12px;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;min-height:64px}
.rows li:last-child .rowi{border-bottom:0}
.av{width:42px;height:42px;flex:none;border-radius:47% 53% 50% 50% / 56% 50% 50% 44%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink)}
.rowi .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rowi .main b{font-size:calc(15.5px * var(--fs));font-weight:700}
.rowi .main b span{font-weight:500;color:var(--ink-3);font-size:calc(13px * var(--fs));margin-left:4px}
.rowi .main > span{font-size:calc(13px * var(--fs));color:var(--ink-2)}
.rowi .main q{font-size:calc(13px * var(--fs));color:var(--ink);quotes:"“" "”";background:var(--lav-bg);border-radius:10px;padding:3px 8px;align-self:flex-start;margin-top:3px}
.rowi .side{font-size:12.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.new-dot{display:inline-block;font-size:11px;font-weight:700;background:var(--pink-d);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-style:normal}
.empty{padding:16px 0;color:var(--ink-3);font-size:calc(14px * var(--fs))}

/* ── give ───────────────────────────────────────── */
.step{font-size:13px;color:var(--ink-2);font-weight:700;background:var(--card);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.give h1{font-size:calc(28px * var(--fs));margin:4px 0 16px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:0 16px;min-height:56px;border:2px solid transparent}
.search:focus-within{border-color:var(--ink)}
.search svg{width:22px;height:22px;color:var(--ink-2);flex:none}
.search input{flex:1;border:0;background:none;font:inherit;font-size:calc(16px * var(--fs));color:var(--ink);outline:none;min-width:0}
.team-h{margin:18px 4px 6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.people{background:var(--card);border-radius:24px;padding:0 16px}
.picked{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px}
.picked .main{flex:1}
.picked .main b{display:block;font-size:calc(17px * var(--fs))}
.picked .main span{font-size:13px;color:var(--ink-2)}
.chg{border:0;background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;min-height:40px}
.store-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.store-h b{font-family:var(--f-display);font-size:calc(19px * var(--fs));font-weight:700}
.store-h span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{position:relative;border:3px solid transparent;border-radius:24px;padding:14px 14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:150px;transition:border-color .2s,transform .14s var(--ease),opacity .2s}
.item:active:not(:disabled){transform:scale(.97)}
.item[aria-pressed="true"]{border-color:var(--ink)}
.item:disabled{opacity:.42}
.item .ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;margin-bottom:auto}
.item .ic svg{width:26px;height:26px}
.item b{font-size:calc(16px * var(--fs));font-weight:700;margin-top:10px}
.item small{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:500}
.item s{opacity:.7;margin-right:3px}
.item .cost{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:4px 9px 4px 7px;font-size:13px;font-weight:700}
.item .sticker{left:66px;top:25px}
.item .tick{position:absolute;right:12px;bottom:12px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:none;place-items:center}
.item[aria-pressed="true"] .tick{display:grid}
.item .tick svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:0;background:var(--card);border-radius:999px;padding:11px 16px;font-size:calc(14.5px * var(--fs));font-weight:600;min-height:44px;transition:all .2s}
.chipb[aria-pressed="true"]{background:var(--ink);color:#fff}
.field{margin-top:12px;background:var(--card);border-radius:22px;padding:14px 16px;border:2px solid transparent;display:block}

function rand(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const n = 9, p = [], f = v => v.toFixed(1);

/* ── stones: 10 candy-coloured stones stacked 4-3-2-1 ───── */
const TONES = ['#C9E063', '#F590BA', '#8EC3EC', '#F7CC42', '#B39CF4', '#F5915A', '#86D6B2', '#F6A79C', '#EFE2C4', '#6F62DA'];

/* ── clock in the status bar ─────────────────────────────── */
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3);
const fmt = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const minus = (t, n) => fmt(toMin(t) - n), plus = (t, n) => fmt(toMin(t) + n);
function clockNow() {
  const d = DAYS[S.day], P = me();
  if (d.weekend) return '10:24';
  if (ui.screen === 'done' && ui.done) return ui.done.time;
  if (ui.gate) return ui.gate.slot === 'in' ? d.in : d.out;
  if (P.phase === 'before') return minus(d.in, 1);
  if (P.phase === 'gate-in') return d.in;
  if (P.phase === 'in') return plus(d.in, 1);
  return plus(d.out, 1);
}
const updateClock = () => { $('[data-role=clock]').textContent = clockNow().replace(/^0/, ''); };

/* ── result card ─────────────────────────────────────────── */
function resultCard(reg, label, P = me(), title = true) {
  const q = qAt(reg), mine = P.answers[reg];
  const dist = q.dist.map((v, i) => v + (mine && mine.a === i ? 1 : 0));
  const total = sum(dist), top = dist.indexOf(Math.max(...dist));
  const rows = q.opts.map((o, i) => {
    const pct = Math.round(dist[i] / total * 100);
    const tags = (i === top ? '<span class="tag rank">1위</span>' : '') + (mine && mine.a === i ? '<span class="tag a">내 답</span>' : '') + (mine && mine.g === i ? '<span class="tag g">내 예상</span>' : '');
    return `<li class="bar${i === top ? ' is-top' : ''}"><div class="bar-label"><span class="txt">${esc(o)}</span>${tags}<span class="pct" data-to="${pct}">${pct}%</span></div><div class="track"><i style="--w:${pct}%;--bc:${OPT_C[i]}"></i></div></li>`;
  }).join('');
  const verdict = !mine ? '<p class="verdict"><i>–</i>이 질문엔 답하지 않았어요</p>'
    : mine.g === top ? `<p class="verdict same"><i>${ICON.check.replace('<svg ', '<svg width="14" height="14" ')}</i>내 예상과 같았어요</p>`
    : '<p class="verdict diff"><i>!</i>내 예상과 달랐어요</p>';
  return `<section class="result"><div class="rhead"><span>${label}</span><span class="num">${total}명 답함</span></div>${title ? `<h3>${esc(q.text)}</h3>` : '<div style="height:14px"></div>'}<ol class="bars">${rows}</ol>${verdict}</section>`;
}
function animateBars(el, delay = 0) {
  if (reduced || !el) return;
  $$('.track i', el).forEach((b, i) => b.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 780, delay: delay + i * 90, easing: EASE, fill: 'backwards' }));
  $$('.pct', el).forEach((p, i) => {
    const to = +p.dataset.to, start = performance.now() + delay + i * 90;
    p.textContent = '0%';
    const tick = now => { const t = Math.min(1, Math.max(0, (now - start) / 780)); p.textContent = Math.round(to * (1 - Math.pow(1 - t, 3))) + '%'; if (t < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
  $$('.tag', el).forEach(t => t.animate([{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'none' }], { duration: 300, delay: delay + 800, easing: EASE, fill: 'backwards' }));
  $$('.verdict', el).forEach(t => t.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: delay + 900, easing: EASE, fill: 'backwards' }));
}

      teaser = `<section class="tile c-white span2"><span class="t-k">출근하면 열려요 · ${resultLabelFor(prev)}의 결과</span><p class="t-h" style="font-size:18px">${esc(qAt(prev).text)}</p></section>`;
    }
    return `<div class="pad">${head}
      <div class="bento">
        ${hero}
        <button class="tile c-sun" data-act="tab-pebbles"><span class="go">${ICON.arrow}</span><span class="t-k">내 조약돌</span><div style="margin:10px 0 6px">${cairn({ filled: P.pebbles, w: 118 })}</div><span class="t-big">${P.pebbles}<small> / 10</small></span></button>
        ${side}
        ${teaser}
        <button class="tile c-white span2" data-act="history" style="flex-direction:row;align-items:center;justify-content:space-between;padding:16px 18px"><span style="font-weight:700">지난 질문 모아보기</span><span class="go" style="position:static;background:var(--bg)">${ICON.arrow}</span></button>
      </div>

  gateAnswer() {

      <h1 class="display q-display">${esc(q.text)}</h1>
      <ol class="opts">${q.opts.map((o, i) => `<li><button class="opt" style="--oc:${OPT_C[i]}" data-act="answer" data-i="${i}" aria-pressed="${g.a === i}"><span class="idx">${i + 1}</span><span>${esc(o)}</span></button></li>`).join('')}</ol>
      <p class="hint">정답은 없어요 · 답은 완전 익명이에요</p>
    </div>`;
  },

  gateGuess() {
    const g = ui.gate, q = qAt(g.reg);
    const when = g.slot === 'in' ? '퇴근할 때' : (S.day === 4 ? '월요일 출근할 때' : '내일 출근할 때');
    return `<div class="pad gate" style="--pbg:var(${GBG[g.reg % GBG.length]})">
      <div class="gate-top"><button class="icon-btn" data-act="gate-back" aria-label="내 답 바꾸기">${ICON.back}</button><div class="prog" aria-label="2/2"><i class="on"></i><i class="on"></i></div></div>
      <p class="q-ref">${esc(q.text)} · 내 답 <b>${esc(q.opts[g.a])}</b></p>

      <ol class="opts">${q.opts.map((o, i) => `<li><button class="opt" style="--oc:${OPT_C[i]}" data-act="guess" data-i="${i}" aria-pressed="${g.g === i}"><span class="idx">${i + 1}</span><span>${esc(o)}</span>${g.a === i ? '<span class="opt-tag">내 답</span>' : ''}</button></li>`).join('')}</ol>
      <p class="hint">${when} 실제 결과가 열려요</p>

  done() {
    const g = ui.done;
    const shown = g.made ? 10 : g.pebbles;
    return `<div class="pad">
      <div class="bento">
        <section class="tile done-hero span2 ${g.slot === 'in' ? 'c-lime' : 'c-sky'}">
          <svg class="check" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="M20 33l8.5 8.5L45 25"/></svg>
          <h1 class="display fu" style="--d:120ms">${g.slot === 'in' ? '출근 완료' : '퇴근 완료'}</h1>
          <p class="done-time fu" style="--d:180ms">${dateOf(S.day)} ${DAYS[S.day].label} · <b>${g.time}</b></p>
        </section>
        <section class="tile get span2 ${g.made ? 'c-sun' : 'c-white'}" aria-live="polite">${cairn({ filled: shown, w: 200, newIdx: shown - 1, glow: g.made })}

      </div>

        ${g.made ? '<button class="btn btn-primary" data-act="to-pebbles">조약돌 보기</button><button class="btn btn-quiet" data-act="done-close">닫기</button>' : '<button class="btn btn-primary" data-act="done-close">확인</button>'}
      </div>
    </div>`;
  },

  pebbles() {
    const P = me();
    const recv = [
      ...S.gifts.filter(g => g.to === S.viewer).map(g => ({ id: g.id, name: who(g.from).name, team: who(g.from).team, item: g.item, date: dateOf(g.day), fresh: !g.seen })),
      ...P.seedIn.map((s, i) => ({ id: 'seed-' + i, name: s.from, team: s.team, item: s.item, date: s.date })),
    ];
    const sent = [
      ...S.gifts.filter(g => g.from === S.viewer).map(g => ({ name: who(g.to).name, team: who(g.to).team, item: g.item, date: dateOf(g.day), reply: g.reply })),
      ...P.seedOut.map(s => ({ name: s.to, team: s.team, item: s.item, date: s.date, reply: s.reply })),
    ];
    const giveTile = P.towers
      ? `<button class="tile c-ink" data-act="give"><span class="go" style="background:rgba(255,255,255,.16);color:#fff">${ICON.arrow}</span><span class="t-k">탑 ${P.towers}개로</span><p class="t-h" style="margin-top:auto">선물<br>고르기</p></button>`
      : `<div class="tile c-rest"><span class="t-k">선물 고르기</span><p class="t-b" style="margin-top:auto">탑이 모이면 동료에게 커피를 건넬 수 있어요</p></div>`;
    return `<div class="pad">
      <header class="top"><h1 class="title">조약돌</h1></header>
      <div class="bento">
        <section class="tile pile span2 c-sun">${cairn({ filled: P.pebbles, w: 280 })}
          <span class="t-big">${P.pebbles}<small> / 10</small></span>
          <p class="t-b">${P.pebbles === 0 && !P.towers && !P.done.length ? '출근하면 첫 조약돌이 생겨요' : `탑 하나까지 조약돌 ${10 - P.pebbles}개`}</p></section>
        <section class="tile c-lav"><span class="t-k">보유 탑</span><span class="t-big" style="margin-top:6px">${P.towers}<small>개</small></span>
          <div class="mini-towers">${Array.from({ length: Math.min(P.towers, 3) }, () => cairn({ filled: 10, w: 40, ghost: false })).join('')}</div>
          <p class="t-b" style="margin-top:auto">${P.towers ? won(P.towers * 2000) + '만큼' : '조약돌 10개면 하나'}</p></section>

      <section class="list" style="margin-top:10px"><h2>건넨 조약돌</h2>
        <ul class="rows">${sent.length ? sent.map(r => `<li><div class="rowi">${avatar(r.name)}<span class="main"><b>${esc(r.name)}<span>${r.team}</span></b><span>${itemById(r.item).name}</span>${r.reply ? `<q>${esc(r.reply)}</q>` : ''}</span><span class="side">${r.date}</span></div></li>`).join('') : '<li class="empty">아직 건넨 조약돌이 없어요</li>'}</ul></section>
    </div>`;

  givePick() {
    const g = ui.give, P = me();
    const head = `<header class="top"><button class="icon-btn" data-act="give-cancel" aria-label="뒤로">${ICON.back}</button><span class="step">1 / 2</span></header>`;

      return `<div class="pad give">${head}<h1 class="display">누구에게 건넬까요?</h1>

      <div class="store-h"><b>사내 카페</b><span>1층 · 반값으로 건네요</span></div>
      <div class="items">${group('cafe')}</div>
      <div class="store-h"><b>모바일 쿠폰</b><span>정가</span></div>
      <div class="items">${group('mobile')}</div>
      <p class="hint" style="margin:14px 4px 0">보유 탑 ${P.towers}개 · 탑 하나는 2,000원만큼이에요</p>
      <div class="bottom stick"><button class="btn btn-primary" data-act="give-next" ${g.item ? '' : 'disabled'}>다음</button></div></div>`;
  },

  giveMsg() {
    const g = ui.give, p = who(g.to), it = itemById(g.item);
    return `<div class="pad give">
      <header class="top"><button class="icon-btn" data-act="give-back" aria-label="뒤로">${ICON.back}</button><span class="step">2 / 2</span></header>
      <h1 class="display">한마디 남길까요?</h1>
      <div class="tile summary ${it.c}">${avatar(p.name)}<span class="main"><b>${esc(p.name)} · ${p.team}</b><span>${it.name} · ${it.group === 'cafe' ? '사내 카페' : '모바일 쿠폰'}</span></span><span class="cost">${ICON.tower}${towersFor(it)}</span></div>
      <div class="chips" role="group" aria-label="고를 수 있는 문장">${MSGS.map((m, i) => `<button class="chipb" data-act="pick-chip" data-i="${i}" aria-pressed="${g.chip === i}">${m}</button>`).join('')}</div>
      <label class="field"><textarea id="msg" maxlength="40" rows="2" placeholder="직접 쓰기 (선택)">${esc(g.text)}</textarea><span class="count" data-role="count">${g.text.length}/40</span></label>
      <p class="soft">받은 분께는 “답례하지 않아도 괜찮아요”가 함께 보여요.</p>
      <div class="bottom stick"><button class="btn btn-primary" data-act="send">탑 ${towersFor(it)}개로 건네기</button></div>
    </div>`;
  },

  sent() {
    const gift = S.gifts[S.gifts.length - 1], p = who(gift.to), it = itemById(gift.item), from = who(gift.from);
    return `<div class="pad sent" style="--pbg:var(--pink-bg)">
      <div class="pass" aria-hidden="true">
        <svg class="arc" viewBox="0 0 358 170" preserveAspectRatio="none"><path d="M50 118 C 130 8, 228 8, 308 118"/></svg>
        ${avatar(from.name, 'me')}${avatar(p.name, 'them')}
        <div class="flyer">${cairn({ filled: 10, w: 64, ghost: false })}</div>
      </div>
      <h1 class="display fu" style="--d:1150ms">${esc(p.name)}님에게<br>${it.name}${josa(it.name, '을', '를')} 건넸어요</h1>
      <p class="caption fu" style="--d:1250ms">화답이 오면 알려드릴게요</p>
      ${gift.chip != null || gift.text ? `<blockquote class="quote fu" style="--d:1350ms;background:#fff">${gift.chip != null ? `<span class="lead">${MSGS[gift.chip]}</span>` : ''}${esc(gift.text)}</blockquote>` : ''}
      <div class="bottom fu" style="--d:1450ms"><button class="btn btn-primary" data-act="to-pebbles">확인</button></div>
    </div>`;
  },

  received() {
    const g = recvData(ui.recv), it = itemById(g.item);
    const place = it.group === 'cafe' ? '1층 사내 카페에서 쓸 수 있어요' : '가까운 매장에서 쓸 수 있어요';
    const chosen = ui.reply || { chip: null, text: '' };
    const composer = g.reply
      ? `<div class="replied">내 화답 · “${esc(g.reply)}”<small>${esc(g.name)}님에게 이 한마디만 전해져요</small></div>`
      : g.live ? `<p class="reply-h">짧게 화답하기 <span>(선택)</span></p>
        <div class="chips">${replies(it).map((m, i) => `<button class="chipb" data-act="reply-chip" data-i="${i}" aria-pressed="${chosen.chip === i}">${m}</button>`).join('')}</div>
        <label class="field"><textarea id="rmsg" maxlength="40" rows="1" placeholder="직접 쓰기">${esc(chosen.text)}</textarea></label>
        <div class="bottom"><button class="btn btn-primary" data-act="send-reply" ${chosen.chip == null && !chosen.text.trim() ? 'disabled' : ''}>화답 보내기</button></div>` : '';
    return `<div class="pad recv">
      <header class="top" style="margin-bottom:6px"><button class="icon-btn" data-act="to-pebbles-back" aria-label="뒤로">${ICON.back}</button><span class="step">${g.date}</span></header>
      <section class="tile recv-hero c-pink">${cairn({ filled: 10, w: 168, ghost: false })}
        <h1 class="display fu" style="--d:480ms;margin-top:16px;text-align:center">${g.team} ${esc(g.name)}님이<br>조약돌을 건넸어요</h1></section>
      <div class="coupon fu" style="--d:620ms"><span class="ic">${ICON[it.icon]}</span><span class="main"><b>${it.name}</b><small>${place}</small><small class="num">${g.until}까지</small></span><button class="mini" data-act="coupon">쿠폰 보기</button></div>
      ${g.chip != null || g.text ? `<blockquote class="quote fu" style="--d:720ms">${g.chip != null ? `<span class="lead">${esc(g.chip)}</span>` : ''}${esc(g.text)}</blockquote>` : ''}
      <p class="soft fu" style="--d:780ms">답례하지 않아도 괜찮아요.</p>
      <div class="fu" style="--d:840ms;display:flex;flex-direction:column;flex:1">${composer}</div>
    </div>`;
  },

  history() {
    const P = me(), cs = ['c-lav', 'c-sky', 'c-pink', 'c-lime', 'c-sun', 'c-orange'];
    const regs = [-1, ...REGS.map((_, i) => i)].filter(r => P.done.some(x => x > r)).reverse();
    const when = r => r < 0 ? '지난주 금요일 퇴근' : `${DAYS[REGS[r][0]].label} ${REGS[r][1] === 'in' ? '출근' : '퇴근'}`;
    const items = regs.map(r => {
      const q = qAt(r), top = q.dist.indexOf(Math.max(...q.dist)), pct = Math.round(q.dist[top] / sum(q.dist) * 100);
      return `<li class="${ui.histOpen === r ? 'open' : ''}"><button class="hist-btn ${cs[(r + 1) % cs.length]}" data-act="hist" data-r="${r}" aria-expanded="${ui.histOpen === r}"><span class="when">${when(r)}</span><b>${esc(q.text)}</b><span class="top1">1위 ${esc(q.opts[top])} · ${pct}%</span></button>
        <div class="hist-body"><div>${resultCard(r, '결과', P, false)}</div></div></li>`;
    }).join('');
    return `<div class="pad">
      <header class="top"><button class="icon-btn" data-act="tab-today-back" aria-label="뒤로">${ICON.back}</button></header>
      <h1 class="title">지난 질문 모아보기</h1>
      <p class="hint" style="margin-top:4px">결과가 열린 질문만 보여요</p>
      ${items ? `<ul class="hist">${items}</ul>` : '<p class="empty" style="margin-top:20px">아직 열린 결과가 없어요. 출근하면 첫 결과가 열려요.</p>'}
    </div>`;
  },
};

function peopleList(q) {
  const list = PEOPLE.filter(p => p.id !== S.viewer && (!q || (p.name + p.team).toLowerCase().includes(q.trim().toLowerCase())));
  if (!list.length) return '<p class="empty">찾는 사람이 없어요</p>';
  const teams = [...new Set(list.map(p => p.team))];
  return teams.map(t => `<p class="team-h">${t}</p><ul class="rows people">${list.filter(p => p.team === t).map(p => `<li><button class="rowi" data-act="pick-person" data-id="${p.id}">${avatar(p.name)}<span class="main"><b>${esc(p.name)}</b><span>${t}</span></span></button></li>`).join('')}</ul>`).join('');
}
function recvData(id) {
  if (String(id).startsWith('seed-')) {
    const s = me().seedIn[+id.slice(5)];
    return { name: s.from, team: s.team, item: s.item, date: s.date, until: '10월 18일', chip: s.chip, text: s.text, reply: '감사해요! 잘 마실게요', live: false };
  }
  const g = S.gifts.find(x => x.id === id), f = who(g.from);
  return { name: f.name, team: f.team, item: g.item, date: dateOf(g.day), until: dateOf(g.day, 30), chip: g.chip != null ? MSGS[g.chip] : null, text: g.text, reply: g.reply, live: true };
}

/* ── signature motion ────────────────────────────────────── */
const FX = {
  done(el) {
    const g = ui.done, st = $('.st.is-new', el), land = $('.land', el), cnt = $('[data-role=count]', el);
    const t0 = 420;
    if (land) { land.style.transformBox = 'fill-box'; land.style.transformOrigin = 'center'; }
    anim(st, [{ transform: 'translateY(-110px) rotate(-14deg)', opacity: 0 }, { transform: 'translateY(5px) rotate(2deg)', opacity: 1, offset: .72 }, { transform: 'none', opacity: 1 }], { duration: 700, delay: t0, easing: 'cubic-bezier(.33,.7,.35,1)', fill: 'backwards' });
    anim(land, [{ opacity: .8, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(1.8)' }], { duration: 720, delay: t0 + 510, fill: 'backwards' });
    setTimeout(() => { if (cnt) cnt.textContent = g.made ? 10 : g.pebbles; }, reduced ? 0 : t0 + 520);
    animateBars($('.result', el), 900);
    if (g.made) {
      const cairnEl = $('.get .cairn', el), glow = $('.glow', el), line = $('[data-role=getline]', el);
      setTimeout(() => {
        anim(glow, [{ opacity: 0 }, { opacity: .85 }], { duration: 900 });
        anim(cairnEl, [{ transform: 'scale(1)' }, { transform: 'scale(1.07) rotate(-1deg)' }, { transform: 'scale(1)' }], { duration: 900 });
        line.innerHTML = '탑 하나가 완성됐어요 · 2,000원만큼';
        anim(line, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 420 });
      }, reduced ? 0 : t0 + 900);
    }
  },
  sent(el) {
    const fl = $('.flyer', el), them = $('.av.them', el), pass = $('.pass', el);
    if (!fl) return;
    if (reduced) { fl.style.opacity = 0; return; }
    const W = pass.clientWidth - 100;
    fl.animate([
      { transform: 'translate(0,46px) scale(.7)', opacity: 0 },
      { transform: 'translate(0,30px) scale(1)', opacity: 1, offset: .18 },
      { transform: `translate(${W * .5}px,-30px) scale(1.08) rotate(6deg)`, offset: .58 },
      { transform: `translate(${W}px,44px) scale(.55)`, opacity: 1, offset: .92 },
      { transform: `translate(${W}px,48px) scale(.4)`, opacity: 0 },
    ], { duration: 1150, delay: 200, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'both' });
    them.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { duration: 500, delay: 1260, easing: EASE });
  },
  received(el) {
    $$('.recv-hero .st', el).forEach((s, i) => anim(s, [{ opacity: 0, transform: 'translateY(-22px)' }, { opacity: 1, transform: 'none' }], { duration: 440, delay: 120 + i * 50, fill: 'backwards' }));
  },
  today(el) {
    $$('.bento > .tile', el).forEach((t, i) => anim(t, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 60 + i * 55, fill: 'backwards' }));
  },
};

function ripple(btn) {
  if (reduced) return;
  for (let i = 0; i < 2; i++) {
    const r = document.createElement('span'); r.className = 'ripple'; btn.appendChild(r);
    r.animate([{ transform: 'scale(.85)', opacity: .5 }, { transform: 'scale(1.55)', opacity: 0 }], { duration: 900, delay: i * 180, easing: 'cubic-bezier(.1,.6,.3,1)', fill: 'both' }).finished.then(() => r.remove());
  }
}

/* ── overlays ────────────────────────────────────────────── */
function banner(name, title, sub, act, id) {
  const ov = $('#overlay');
  ov.innerHTML = `<button class="banner" data-act="${act}" ${id ? `data-id="${id}"` : ''}>${avatar(name)}<span class="main"><b>${esc(title)}</b><span>${esc(sub)}</span></span></button>`;
  const b = $('.banner', ov);
  requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('show')));
  setTimeout(() => b.classList.remove('show'), 5200);
}
function sheet(html) {
  const ov = $('#overlay');
  ov.innerHTML = `<div class="scrim" data-act="sheet-close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="설정">${html}</section>`;
  requestAnimationFrame(() => requestAnimationFrame(() => app.classList.add('sheet-on')));
}
function closeSheet() {
  app.classList.remove('sheet-on');
  setTimeout(() => { if (!app.classList.contains('sheet-on')) $('#overlay').innerHTML = ''; }, 460);
}
const settingsHTML = () => `<div class="grab"></div><h2 class="title" style="font-size:24px">설정</h2>
  <div class="set-card">
    <div class="set-row"><div><b>근태 연결</b><br><span>A사 근태 시스템</span></div><span class="pill-ok">연결됨</span></div>
    <div class="set-row"><div><b>글자 크기</b></div><div class="seg"><button data-act="font" data-v="0" aria-pressed="${!S.large}">보통</button><button data-act="font" data-v="1" aria-pressed="${S.large}">크게</button></div></div>
    <div class="set-row"><div><b>답의 공개 범위</b><br><span>완전 익명 · 회사도 볼 수 없어요</span></div></div>
  </div>`;

/* ── domain actions ──────────────────────────────────────── */
function startGate(slot) {
  const P = me(), d = DAYS[S.day], reg = regOf(S.day, slot);
  P.times[S.day] = { ...(P.times[S.day] || {}), [slot]: d[slot] };
  P.phase = slot === 'in' ? 'gate-in' : 'gate-out';
  ui.gate = { slot, reg, a: null, g: null, time: d[slot] };
  save();
}
function completeGate(P = me(), gate = ui.gate) {
  P.answers[gate.reg] = { a: gate.a, g: gate.g };
  if (!P.done.includes(gate.reg)) P.done.push(gate.reg);
  P.pebbles += 1;
  let made = false;
  if (P.pebbles >= 10) { P.pebbles = 0; P.towers += 1; made = true; }
  P.phase = gate.slot === 'in' ? 'in' : 'out';
  return { made, pebbles: made ? 10 : P.pebbles, prev: gate.reg - 1 };
}
function nextDay() {
  if (S.day >= 6) return;
  S.day = S.day === 4 ? 5 : S.day === 5 ? 6 : S.day + 1;
  Object.values(S.p).forEach(P => { P.phase = 'before'; });
  ui.gate = null; save();
}
function fastForward() {
  const P = S.p.lucy;
  S.onboarded = true;
  for (let i = 0; i <= 9; i++) {
    if (P.done.includes(i)) continue;
    const [day, slot] = REGS[i];
    if (day < S.day || (day === S.day && slot === 'in' && ['in', 'gate-out', 'out'].includes(P.phase))) continue;
    S.day = day;
    P.times[day] = { ...(P.times[day] || {}), [slot]: DAYS[day][slot] };
    const q = QS[i], top = q.dist.indexOf(Math.max(...q.dist));
    completeGate(P, { reg: i, slot, a: (top + 1 + i) % 4, g: (top + (i % 3 === 0 ? 0 : 2)) % 4 });
  }
  S.day = 4; P.phase = 'out';
  Object.entries(S.p).forEach(([k, p]) => { if (k !== 'lucy') { p.phase = 'out'; p.times[4] = { in: '09:06', out: '18:14' }; } });
  save();
}
function switchViewer(id) {
  if (S.viewer === id) return;
  S.viewer = id; ui.gate = null; ui.give = null; ui.recv = null; save();
  const unseen = S.gifts.find(g => g.to === id && !g.seen);
  const replied = S.gifts.find(g => g.from === id && g.reply && !g.replySeen);
  go(replied ? 'pebbles' : 'today', 'fade');
  setTimeout(() => {
    if (unseen) { const f = who(unseen.from); banner(f.name, `${f.team} ${f.name}님이 조약돌을 건넸어요`, itemById(unseen.item).name, 'open-gift', unseen.id); }
    else if (replied) { const t = who(replied.to); replied.replySeen = true; save(); banner(t.name, `${t.name}님이 화답했어요`, `“${replied.reply}”`, 'noop'); }
  }, reduced ? 0 : 650);
}

/* ── events ──────────────────────────────────────────────── */
const ACT = {
  start() { S.onboarded = true; save(); go('today', 'rise'); },
  'clock-in'(el) { if (ui.gate) return; ripple(el); startGate('in'); setTimeout(() => go('gateAnswer', 'rise'), reduced ? 0 : 420); },
  'clock-out'(el) { if (ui.gate) return; ripple(el); startGate('out'); setTimeout(() => go('gateAnswer', 'rise'), reduced ? 0 : 420); },
  resume() { const P = me(), slot = P.phase === 'gate-in' ? 'in' : 'out'; ui.gate = { slot, reg: regOf(S.day, slot), a: null, g: null, time: P.times[S.day][slot] }; go('gateAnswer', 'rise'); },
  answer(el) {
    if (!ui.gate || ui.gate.lock) return;
    ui.gate.a = +el.dataset.i; ui.gate.lock = true;
    $$('.opt', host.lastElementChild).forEach(b => b.setAttribute('aria-pressed', b === el));
    setTimeout(() => go('gateGuess', 'push'), reduced ? 0 : 280);
  },
  guess(el) {
    ui.gate.g = +el.dataset.i;
    const scr = host.lastElementChild;
    $$('.opt', scr).forEach(b => b.setAttribute('aria-pressed', b === el));
    $('[data-act=gate-complete]', scr).disabled = false;
  },
  'gate-back'() { ui.gate.lock = false; go('gateAnswer', 'pop'); },
  'gate-complete'() {
    if (!ui.gate || ui.gate.g == null) return;
    const r = completeGate();
    ui.done = { slot: ui.gate.slot, time: ui.gate.time, made: r.made, pebbles: r.pebbles, prev: r.prev };
    ui.gate = null; save(); go('done', 'rise');
  },
  'done-close'() { ui.done = null; go('today', 'fade'); },
  'to-pebbles'() { ui.done = null; go('pebbles', 'fade'); },
  'to-pebbles-back'() { go('pebbles', 'pop'); },
  'tab-today'() { if (ui.screen !== 'today') go('today', 'tab'); },
  'tab-today-back'() { go('today', 'pop'); },
  'tab-pebbles'() {
    if (ui.screen === 'pebbles') return;
    S.gifts.forEach(g => { if (g.from === S.viewer && g.reply) g.replySeen = true; }); save();
    go('pebbles', ui.screen === 'today' ? 'tab' : 'fade');
  },
  history() { ui.histOpen = -2; go('history', 'push'); },
  hist(el) {
    const r = +el.dataset.r, li = el.parentElement;
    ui.histOpen = ui.histOpen === r ? -2 : r;
    const open = ui.histOpen === r;
    $$('.hist li', host.lastElementChild).forEach(x => x.classList.remove('open'));
    if (open) { li.classList.add('open'); animateBars($('.result', li), 120); }
    el.setAttribute('aria-expanded', open);
  },
  give() { ui.give = { to: null, item: null, q: '', chip: null, text: '' }; go('givePick', 'push'); },
  'give-cancel'() { go('pebbles', 'pop'); },
  'pick-person'(el) { ui.give.to = el.dataset.id; ui.give.item = null; go('givePick', 'push'); },
  'change-person'() { ui.give.to = null; go('givePick', 'pop'); },
  'pick-item'(el) { ui.give.item = el.dataset.id; $$('.item', host.lastElementChild).forEach(b => b.setAttribute('aria-pressed', b === el)); $('[data-act=give-next]', host.lastElementChild).disabled = false; },
  'give-next'() { go('giveMsg', 'push'); },
  'give-back'() { go('givePick', 'pop'); },
  'pick-chip'(el) { const i = +el.dataset.i; ui.give.chip = ui.give.chip === i ? null : i; $$('.chipb', host.lastElementChild).forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === ui.give.chip)); },
  send() {
    if (!ui.give) return;
    const g = ui.give, it = itemById(g.item), P = me();
    P.towers -= towersFor(it);
    S.gifts.push({ id: 'g' + Date.now(), from: S.viewer, to: g.to, item: g.item, chip: g.chip, text: g.text.trim(), day: S.day, seen: false, reply: null, replySeen: false });
    ui.give = null; save(); go('sent', 'rise');
  },
  'open-gift'(el) {
    const id = el.dataset.id; ui.recv = id; ui.reply = { chip: null, text: '' };
    const g = S.gifts.find(x => x.id === id); if (g) { g.seen = true; save(); }
    const b = $('.banner'); if (b) b.classList.remove('show');
    go('received', 'push');
  },
  'reply-chip'(el) { const i = +el.dataset.i; ui.reply.chip = ui.reply.chip === i ? null : i; const scr = host.lastElementChild; $$('.chipb', scr).forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === ui.reply.chip)); $('[data-act=send-reply]', scr).disabled = ui.reply.chip == null && !ui.reply.text.trim(); },
  'send-reply'() {
    const g = S.gifts.find(x => x.id === ui.recv), it = itemById(g.item);
    const chip = ui.reply.chip != null ? replies(it)[ui.reply.chip] : '', text = ui.reply.text.trim();
    g.reply = [chip, text].filter(Boolean).join(' '); save();
    const box = $('.recv > .fu:last-child', host.lastElementChild);
    if (box) { box.innerHTML = `<div class="replied">내 화답 · “${esc(g.reply)}”<small>${esc(who(g.from).name)}님에게 이 한마디만 전해져요</small></div>`; anim(box.firstElementChild, [{ opacity: 0, transform: 'translateY(8px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 460 }); }
    renderDemo();
  },
  coupon(el) { el.textContent = 'A7K2-19Q4'; el.disabled = true; },
  settings() { sheet(settingsHTML()); },
  'sheet-close'() { closeSheet(); },
  font(el) { S.large = el.dataset.v === '1'; save(); app.classList.toggle('large', S.large); $('.sheet').innerHTML = settingsHTML(); },
  noop() {},
  'demo-open'() { $('#demo').classList.add('open'); },
  'demo-close'() { $('#demo').classList.remove('open'); },
  'next-day'() { nextDay(); ui.done = null; go('today', 'fade'); },
  fast() { fastForward(); ui.done = null; S.viewer = 'lucy'; go('pebbles', 'fade'); },
  'as-lucy'() { switchViewer('lucy'); },
  'as-julie'() { switchViewer('julie'); },
  reset() { S = fresh(); save(); Object.assign(ui, { gate: null, done: null, give: null, recv: null }); app.classList.remove('large'); go('onboard', 'fade'); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.give.q = e.target.value; $('[data-role=people]').innerHTML = peopleList(ui.give.q); }
  if (e.target.id === 'msg') { ui.give.text = e.target.value; $('[data-role=count]', host.lastElementChild).textContent = `${e.target.value.length}/40`; }
  if (e.target.id === 'rmsg') { ui.reply.text = e.target.value; $('[data-act=send-reply]', host.lastElementChild).disabled = ui.reply.chip == null && !ui.reply.text.trim(); }
});

/* ── demo panel ──────────────────────────────────────────── */
function hint() {
  const P = S.p.lucy, gift = S.gifts.find(g => g.to === 'julie');
  if (!S.onboarded) return ['시작', '앱에서 ‘시작하기’를 눌러 보세요.'];
  if (S.viewer === 'julie') {
    if (gift && !gift.reply) return ['받는 쪽', 'Lucy가 건넨 조약돌이 와 있어요. 열어 보고, 원하면 짧게 화답해 보세요.'];
    if (gift && gift.reply) return ['다시 Lucy로', '화답을 보냈어요. Lucy로 바꾸면 화답이 도착해 있어요.'];
    return ['받는 쪽', 'Lucy가 탑을 모아 Julie에게 건네면 여기로 도착해요.'];
  }
  if (gift && !gift.seen) return ['건넸어요', '‘Julie’로 바꿔 받는 쪽 화면을 보세요.'];
  if (S.day === 5) return ['주말', '주말에는 질문이 없어요. ‘월요일 아침으로’를 누르면 금요일 퇴근 질문의 결과가 열려요.'];
  if (P.towers > 0 && !gift) return ['탑 완성', '‘선물 고르기’를 눌러 Julie에게 건네 보세요. 사내 카페는 반값이에요.'];
  if (P.phase === 'before') return ['출근', '검은 돌 ‘출근하기’를 누르면 오늘의 질문이 나와요. 답하고 예상해야 출근이 완료돼요.'];
  if (P.phase === 'in') return ['근무 중', '‘퇴근하기’를 누르면 시간이 퇴근 시각으로 넘어가요.'];
  if (P.phase === 'out' && S.day < 6) return ['퇴근', '‘다음 날 아침으로’를 눌러 하루를 넘겨 보세요. 한 번에 보려면 ‘이번 주 빠르게 채우기’.'];
  if (P.phase.startsWith('gate')) return ['질문 중', '답을 고르고, 다른 사람들이 가장 많이 고른 답을 예상해 보세요.'];
  return ['끝', '시연은 여기까지예요. ‘처음부터’로 다시 볼 수 있어요.'];
}
function renderDemo() {
  const P = S.p.lucy, [h, txt] = hint();
  const nextLabel = S.day < 4 ? '다음 날 아침으로' : S.day === 4 ? '주말로' : S.day === 5 ? '월요일 아침으로' : '다음 날 없음';
  const week = [0, 1, 2, 3, 4].map(d => `<div class="d${S.day === d ? ' today' : ''}"><span>${'월화수목금'[d]}</span><span class="pips">${['in', 'out'].map(s => { const r = regOf(d, s); return `<i style="--c:${TONES[r]}" class="${P.done.includes(r) ? 'done' : ''}${S.day === d && ((s === 'in' && P.phase === 'before') || (s === 'out' && P.phase === 'in')) ? ' now' : ''}" title="${s === 'in' ? '출근' : '퇴근'}"></i>`; }).join('')}</span></div>`).join('');
  $('#demo').innerHTML = `
    <button class="demo-close" data-act="demo-close">닫기</button>
    <div><p class="kicker">시연 패널 · 앱 밖의 조작</p><h2>조약돌</h2></div>
    <p class="hint-box"><b>${h}</b><br>${txt}</p>
    <div><p class="kicker" style="margin-bottom:10px">Lucy의 한 주 · 출근 / 퇴근</p><div class="week">${week}</div></div>
    <div class="seg" role="group" aria-label="보는 사람"><button data-act="as-lucy" aria-pressed="${S.viewer === 'lucy'}">Lucy · 재무팀</button><button data-act="as-julie" aria-pressed="${S.viewer === 'julie'}">Julie · 마케팅팀</button></div>
    <div class="demo-actions">
      <button class="dbtn main" data-act="next-day" ${S.day >= 6 || !S.onboarded ? 'disabled' : ''}>${nextLabel}<span>→</span></button>
      <button class="dbtn" data-act="fast" ${P.done.includes(9) ? 'disabled' : ''}>이번 주 빠르게 채우기<span>»</span></button>
      <button class="dbtn quiet" data-act="reset">처음부터 다시 보기</button>
    </div>
    <details><summary>이 프로토타입에 대해</summary><p>2024 ICISTS × KAIST 해커페어 「조약돌」을 2026년에 다시 설계한 화면입니다. 회사는 가상의 A사(약 210명), 응답 분포는 예시 값입니다. 진행 상황은 이 브라우저에만 저장돼요.</p></details>`;
}

/* ── scale the device to fit the window ──────────────────── */
function fit() {
  const k = Math.min(1, (innerHeight - 64) / 868, (innerWidth - 32) / 414);
  document.documentElement.style.setProperty('--k', Math.max(.6, k).toFixed(3));
}
addEventListener('resize', fit); fit();

/* ── boot ────────────────────────────────────────────────── */
app.classList.toggle('large', !!S.large);
go(S.onboarded ? 'today' : 'onboard', 'fade');
})();
</script>
