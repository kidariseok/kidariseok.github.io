<title>조약돌</title>
<meta name="theme-color" content="#EEF1EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   조약돌 · Hi-fi prototype
   Visual direction: 강가의 젖은 조약돌.
   - 바탕은 물안개처럼 차가운 회녹색(mist), 글자는 깊은 강물색(ink).
   - 2024년의 파랑·크림을 이어받아 파랑은 젖은 돌의 짙은 청회색(river)으로,
     크림은 '새로 놓인 돌'을 표시하는 햇빛색(sun)으로만 쓴다.
   - 조약돌은 한 개씩 다른 돌색. 장식이 아니라 실제 돌의 형태로 그린다.
   - 질문과 큰 순간은 Hahmlet(한글 세리프), 나머지 UI는 IBM Plex Sans KR.
   Layout: 데스크톱은 [폰 | 시연 패널], 폰 너비에서는 앱이 화면 전체를 쓴다.
   ───────────────────────────────────────────────────────────── */
:root{
  /* stage (theme-aware) */
  --stage:#E3E8E6; --stage-ink:#1C2A33; --stage-ink-2:#5B6A73; --stage-line:#CBD3D0; --stage-card:#F4F6F5;
  /* app (light product) */
  --mist:#EEF1EF; --paper:#FBFBF9; --ink:#16232C; --ink-2:#4A5862; --ink-3:#7C8992;
  --line:#DDE3E0; --line-2:#C7CFCC; --river:#2B5876; --river-deep:#1B3E55; --river-tint:#E2EBF0;
  --sun:#EFD98C; --sun-tint:#FAF2D2;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --fs:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#101517; --stage-ink:#DCE3E6; --stage-ink-2:#93A1A9; --stage-line:#28323A; --stage-card:#182024; color-scheme:dark}}
:root[data-theme="dark"]{--stage:#101517; --stage-ink:#DCE3E6; --stage-ink-2:#93A1A9; --stage-line:#28323A; --stage-card:#182024; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--stage-ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--river);outline-offset:2px}

/* ── stage ───────────────────────────────────────── */
.stage{min-height:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px 48px;padding-block:20px}
.device{width:calc(390px * var(--k,1) + 24px);height:calc(844px * var(--k,1) + 24px);padding:12px;border-radius:calc(54px * var(--k,1) + 12px);background:#0E1418;box-shadow:0 30px 60px -20px rgba(10,20,26,.45),inset 0 0 0 1.5px #2A343B;flex:none}
.viewport{width:calc(390px * var(--k,1));height:calc(844px * var(--k,1));border-radius:calc(44px * var(--k,1));overflow:hidden;position:relative}

/* ── app shell ───────────────────────────────────── */
.app{word-break:keep-all;overflow-wrap:anywhere;position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--k,1));transform-origin:0 0;background:var(--mist);color:var(--ink);overflow:hidden;font-size:calc(15px * var(--fs));line-height:1.5;letter-spacing:-.005em}
.app.large{--fs:1.1}
.statusbar{position:absolute;inset:0 0 auto 0;height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-weight:600;font-size:15px;z-index:30;pointer-events:none;font-variant-numeric:tabular-nums}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.statusbar .sys i{display:block;background:var(--ink);border-radius:2px}
.host{position:absolute;inset:48px 0 0 0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;will-change:transform,opacity}
.screen::-webkit-scrollbar{display:none}
.pad{min-height:100%;padding:12px 22px 120px;display:flex;flex-direction:column}
.no-tabs .pad{padding-bottom:28px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;padding:8px 40px 26px;display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20;transition:transform .42s var(--ease),opacity .3s}
.tabbar.hidden{transform:translateY(100%);opacity:0;pointer-events:none}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--ink-3);padding-top:4px;min-height:44px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic-fill{fill:var(--ink)}

/* type */
.eyebrow{margin:0;font-size:calc(12.5px * var(--fs));font-weight:500;color:var(--ink-3);letter-spacing:.01em}
.display{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;line-height:1.28;text-wrap:balance}
.title{margin:0;font-size:calc(22px * var(--fs));font-weight:700;letter-spacing:-.02em}
.caption{margin:0;color:var(--ink-2);font-size:calc(14px * var(--fs));text-align:center;text-wrap:balance}
.hint{margin:0;color:var(--ink-3);font-size:calc(13px * var(--fs))}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{width:100%;min-height:56px;border:0;border-radius:16px;font-weight:600;font-size:calc(16px * var(--fs));display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),opacity .2s,background .2s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--river-deep);color:#F4F7F8}
.btn-primary:disabled{background:var(--line-2);color:#F4F7F8}
.btn-quiet{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:24px;height:24px}
.link{border:0;background:none;color:var(--ink-2);font-size:calc(13.5px * var(--fs));font-weight:500;padding:12px 0;min-height:44px}
.bottom{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px}
.bottom.stick{position:sticky;bottom:0;margin-inline:-22px;padding:24px 22px 4px;background:linear-gradient(to bottom,rgba(238,241,239,0),var(--mist) 34%)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:12px}
.top .who{margin:2px 0 0;font-weight:600;font-size:calc(17px * var(--fs));letter-spacing:-.01em}
.back{display:flex;align-items:center;gap:2px;margin-left:-12px}

/* ── stones ─────────────────────────────────────── */
.cairn{display:block;overflow:visible}
.cairn .st{transform-box:fill-box;transform-origin:50% 100%}
.cairn .ghost{fill:none;stroke:#BCC5C1;stroke-width:1;stroke-dasharray:3 3}
.cairn-shadow{fill:rgba(22,35,44,.10)}
.cairn .glow{fill:var(--sun);opacity:0}

.stone-btn{position:relative;width:260px;height:184px;border:0;background:none;padding:0;display:grid;place-items:center;transition:transform .16s var(--ease);-webkit-tap-highlight-color:transparent}
.stone-btn:active:not(:disabled){transform:scale(.965)}
.stone-btn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stone-btn .sb-shadow{fill:rgba(16,34,46,.28);filter:blur(10px)}
.stone-btn .sb-label{position:relative;color:#F2F6F8;font-weight:600;font-size:calc(21px * var(--fs));letter-spacing:-.01em}
.stone-btn.rest .sb-label{color:var(--ink-2);font-size:calc(17px * var(--fs));font-weight:500}
.ripple{position:absolute;left:50%;top:50%;width:250px;height:176px;margin:-88px 0 0 -125px;border-radius:50%;border:1.5px solid var(--river);pointer-events:none;opacity:0}

/* ── today ──────────────────────────────────────── */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:24px 18px}
.chip-time{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:calc(13px * var(--fs));color:var(--ink-2)}
.chip-time b{color:var(--ink);font-weight:600}
.teaser{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.teaser .q{margin:0;font-family:var(--f-display);font-weight:600;font-size:calc(17px * var(--fs));line-height:1.4}
.teaser .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mine{display:inline-flex;gap:6px;align-items:center;font-size:calc(12.5px * var(--fs));color:var(--ink-2)}
.mine b{background:var(--sun-tint);color:var(--ink);font-weight:600;border-radius:6px;padding:2px 7px}
.strip{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--paper);border:1px solid var(--line);text-align:left;width:100%}
.strip .meta{flex:1;display:flex;flex-direction:column;gap:1px}
.strip .meta b{font-size:calc(15px * var(--fs))}
.strip .meta span{font-size:calc(12.5px * var(--fs));color:var(--ink-3)}
.strip .chev{color:var(--ink-3)}

/* ── gate ───────────────────────────────────────── */
.gate-top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.gate-state{display:inline-flex;align-items:center;gap:8px;font-size:calc(13px * var(--fs));font-weight:600;color:var(--river)}
.gate-state .pulse{width:8px;height:8px;border-radius:50%;background:var(--river);box-shadow:0 0 0 0 rgba(43,88,118,.4);animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(43,88,118,0)}100%{box-shadow:0 0 0 0 rgba(43,88,118,0)}}
.prog{display:flex;gap:5px}
.prog i{width:22px;height:4px;border-radius:2px;background:var(--line-2);transition:background .3s}
.prog i.on{background:var(--river-deep)}
.gate .lead{margin:26px 0 10px}
.q-display{font-size:calc(27px * var(--fs));line-height:1.32;margin:0 0 6px}
.q-ref{margin:18px 0 6px;font-size:calc(13.5px * var(--fs));color:var(--ink-3)}
.q-ref b{color:var(--ink-2);font-weight:500}
.opts{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{width:100%;min-height:60px;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left;font-size:calc(16px * var(--fs));font-weight:500;transition:border-color .2s,box-shadow .2s,background .2s,transform .12s var(--ease)}
.opt:active{transform:scale(.985)}
.opt .idx{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--ink-3);background:var(--mist);transition:background .2s,color .2s}
.opt .opt-tag{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--sun-tint);border-radius:6px;padding:2px 7px}
.opt[aria-pressed="true"]{border-color:var(--river-deep);box-shadow:inset 0 0 0 1px var(--river-deep);background:#fff}
.opt[aria-pressed="true"] .idx{background:var(--river-deep);color:#fff}
.gate .hint{margin-top:16px}

/* ── done ───────────────────────────────────────── */
.done-head{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:24px}
.check{width:56px;height:56px}
.check circle{fill:none;stroke:var(--river);stroke-width:2.2;stroke-dasharray:157;stroke-dashoffset:157;animation:draw .7s var(--ease) .05s forwards}
.check path{fill:none;stroke:var(--river);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .42s var(--ease) .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done-head .display{font-size:calc(30px * var(--fs));margin-top:8px}
.done-time{margin:0;font-size:calc(15px * var(--fs));color:var(--ink-2);font-variant-numeric:tabular-nums}
.get{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 0 18px}
.get-line{margin:0;font-size:calc(14.5px * var(--fs));color:var(--ink-2);text-align:center}
.get-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.get-line.made{color:var(--ink);font-weight:600}
.land{fill:none;stroke:var(--sun);stroke-width:2;opacity:0}
.fu{animation:fu .6s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes fu{from{opacity:0;transform:translateY(12px)}}

/* result card */
.result{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px}
.result .eyebrow{display:flex;justify-content:space-between}
.result h3{margin:6px 0 14px;font-family:var(--f-display);font-weight:600;font-size:calc(18px * var(--fs));line-height:1.4;letter-spacing:-.01em}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.bar-label{display:flex;align-items:center;gap:6px;font-size:calc(14px * var(--fs));margin-bottom:6px}
.bar-label .txt{flex:1;min-width:0}
.bar-label .pct{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);min-width:38px;text-align:right}
.track{height:8px;border-radius:4px;background:#E5EAE8;overflow:hidden}
.track i{display:block;height:100%;width:var(--w);border-radius:4px;background:#AAB4B1;transform-origin:0 50%}
.bar.is-top .track i{background:var(--river-deep)}
.bar.is-top .pct{color:var(--ink)}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag.a{background:var(--sun-tint);color:var(--ink)}
.tag.g{background:var(--river-tint);color:var(--river-deep)}
.verdict{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:calc(13.5px * var(--fs));color:var(--ink-2);display:flex;align-items:center;gap:8px}
.verdict::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}
.verdict.diff::before{background:var(--sun)}
.verdict.same::before{background:var(--river)}

/* ── pebbles ────────────────────────────────────── */
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 22px}
.pile-count{margin:6px 0 0;font-size:calc(34px * var(--fs));font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pile-count span{font-size:calc(18px * var(--fs));color:var(--ink-3);font-weight:500}
.shelf{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.shelf-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.shelf-n{margin:4px 0 0;font-size:calc(22px * var(--fs));font-weight:700;letter-spacing:-.02em}
.shelf-n span{font-size:calc(14px * var(--fs));color:var(--ink-3);font-weight:500}
.mini-towers{display:flex;gap:4px;align-items:flex-end}
.sec{margin:30px 0 4px;font-size:calc(13px * var(--fs));font-weight:600;color:var(--ink-3)}
.rows{list-style:none;margin:0;padding:0}
.rowi{width:100%;display:flex;align-items:center;gap:12px;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;min-height:60px}
.rowi:last-child{border-bottom:0}
.av{width:38px;height:38px;flex:none;border-radius:46% 54% 50% 50% / 55% 50% 50% 45%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#24323B}
.rowi .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rowi .main b{font-size:calc(15px * var(--fs));font-weight:600}
.rowi .main span{font-size:calc(12.5px * var(--fs));color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .main q{font-size:calc(13px * var(--fs));color:var(--ink-2);quotes:"“" "”"}
.rowi .side{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.new-dot{width:8px;height:8px;border-radius:50%;background:var(--river);display:inline-block;margin-left:6px;vertical-align:2px}
.empty{padding:16px 0;color:var(--ink-3);font-size:calc(13.5px * var(--fs))}

/* ── give ───────────────────────────────────────── */
.step{font-size:12.5px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.give h1{font-size:calc(24px * var(--fs));margin:8px 0 16px}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0 14px;min-height:52px}
.search svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.search input{flex:1;border:0;background:none;font:inherit;font-size:calc(15.5px * var(--fs));color:var(--ink);outline:none;min-width:0}
.team-h{margin:18px 0 2px;font-size:12px;font-weight:600;color:var(--ink-3)}
.picked{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.picked .main{flex:1}
.picked .main b{display:block;font-size:calc(16px * var(--fs))}
.picked .main span{font-size:12.5px;color:var(--ink-3)}
.store-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 8px}
.store-h b{font-size:calc(15px * var(--fs))}
.store-h span{font-size:12px;color:var(--ink-3)}
.badge-half{font-size:11px;font-weight:700;color:var(--river-deep);background:var(--river-tint);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.items{display:flex;flex-direction:column;gap:8px}
.item{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:10px 14px;text-align:left;min-height:62px;transition:border-color .2s,box-shadow .2s}
.item[aria-pressed="true"]{border-color:var(--river-deep);box-shadow:inset 0 0 0 1px var(--river-deep)}
.item:disabled{opacity:.48}
.item .ic{width:38px;height:38px;border-radius:12px;background:var(--mist);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.item .ic svg{width:22px;height:22px}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column}
.item .main b{font-weight:600;font-size:calc(15px * var(--fs))}
.item .main small{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item .main s{color:var(--ink-3);margin-right:4px}
.cost{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:9px 14px;font-size:calc(14px * var(--fs));min-height:40px;transition:all .2s}
.chipb[aria-pressed="true"]{background:var(--river-deep);border-color:var(--river-deep);color:#F4F7F8}
.field{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.field textarea{width:100%;border:0;background:none;resize:none;font:inherit;font-size:calc(15px * var(--fs));color:var(--ink);outline:none;min-height:52px}
.field .count{display:block;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.summary{display:flex;align-items:center;gap:12px;padding:12px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.summary .main{flex:1}
.summary .main b{display:block}
.summary .main span{font-size:12.5px;color:var(--ink-3)}
.soft{margin:14px 0 0;font-size:calc(13px * var(--fs));color:var(--ink-3)}

/* ── sent / received ────────────────────────────── */
.pass{position:relative;height:150px;margin:36px 0 20px}
.pass .av{position:absolute;top:84px;width:52px;height:52px;font-size:18px}
.pass .av.me{left:12px}
.pass .av.them{right:12px}
.pass .arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pass .arc path{fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:3 5}
.flyer{position:absolute;left:8px;top:40px;width:60px}
.sent h1,.recv h1{font-size:calc(26px * var(--fs));margin:0}
.sent .caption{text-align:left;margin-top:10px}

  const n = 9, p = [], f = v => v.toFixed(1);

  }).join('');

    requestAnimationFrame(tick);

  sent(el) {

    if (!fl || reduced) { if (fl) fl.style.opacity = 0; return; }
    const W = pass.clientWidth - 76;
    fl.animate([
      { transform: 'translate(0,40px) scale(.7)', opacity: 0 },
      { transform: 'translate(0,24px) scale(1)', opacity: 1, offset: .18 },

      { transform: `translate(${W}px,40px) scale(.55)`, opacity: 1, offset: .92 },

    ], { duration: 1150, delay: 200, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'both' });
    them.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.16)' }, { transform: 'scale(1)' }], { duration: 480, delay: 1260, easing: EASE });
  },
  received(el) {

};

function ripple(btn) {
  if (reduced) return;
  for (let i = 0; i < 2; i++) {
    const r = document.createElement('span'); r.className = 'ripple'; btn.appendChild(r);
    r.animate([{ transform: 'scale(.82)', opacity: .55 }, { transform: 'scale(1.55)', opacity: 0 }], { duration: 900, delay: i * 180, easing: 'cubic-bezier(.1,.6,.3,1)', fill: 'both' }).finished.then(() => r.remove());
  }
}

/* ── domain actions ──────────────────────────────────────── */
function startGate(slot) {
  const P = me(), d = DAYS[S.day], reg = regOf(S.day, slot);
  P.times[S.day] = { ...(P.times[S.day] || {}), [slot]: d[slot] };
  P.phase = slot === 'in' ? 'gate-in' : 'gate-out';
  ui.gate = { slot, reg, a: null, g: null, time: d[slot] };
  save();
}
function completeGate(P = me(), gate = ui.gate) {
  P.answers[gate.reg] = { a: gate.a, g: gate.g };
  if (!P.done.includes(gate.reg)) P.done.push(gate.reg);
  P.pebbles += 1;
  let made = false;
  if (P.pebbles >= 10) { P.pebbles = 0; P.towers += 1; made = true; }
  P.phase = gate.slot === 'in' ? 'in' : 'out';
  return { made, pebbles: made ? 10 : P.pebbles, prev: gate.reg - 1 };
}
function nextDay() {
  if (S.day >= 6) return;
  S.day = S.day === 4 ? 5 : S.day === 5 ? 6 : S.day + 1;
  Object.values(S.p).forEach(P => { P.phase = 'before'; });
  ui.gate = null; save();
}
function fastForward() {
  const P = S.p.lucy;
  S.onboarded = true;
  for (let i = 0; i <= 9; i++) {
    if (P.done.includes(i)) continue;
    const [day, slot] = REGS[i];
    if (day < S.day || (day === S.day && slot === 'in' && ['in', 'gate-out', 'out'].includes(P.phase))) continue;
    S.day = day;
    P.times[day] = { ...(P.times[day] || {}), [slot]: DAYS[day][slot] };
    const q = QS[i], top = q.dist.indexOf(Math.max(...q.dist));
    completeGate(P, { reg: i, slot, a: (top + 1 + i) % 4, g: (top + (i % 3 === 0 ? 0 : 2)) % 4 });
  }
  S.day = 4; P.phase = 'out';
  Object.entries(S.p).forEach(([k, p]) => { if (k !== 'lucy') p.phase = 'out'; });
  save();
}
function switchViewer(id) {
  if (S.viewer === id) return;
  S.viewer = id; ui.gate = null; ui.give = null; ui.recv = null; save();
  const unseen = S.gifts.find(g => g.to === id && !g.seen);
  const replied = S.gifts.find(g => g.from === id && g.reply && !g.replySeen);
  go(unseen || replied ? 'pebbles' : 'today', 'fade');
  setTimeout(() => {
    if (unseen) { const f = who(unseen.from); banner(f.name, `${f.team} ${f.name}님이 조약돌을 건넸어요`, itemById(unseen.item).name, 'open-gift', unseen.id); }
    else if (replied) { const t = who(replied.to); replied.replySeen = true; save(); banner(t.name, `${t.name}님이 화답했어요`, `“${replied.reply}”`, 'noop'); }
  }, reduced ? 0 : 650);
}

/* ── events ──────────────────────────────────────────────── */
const ACT = {
  start() { S.onboarded = true; save(); go('today', 'rise'); },
  'clock-in'(el) { if (ui.gate) return; ripple(el); startGate('in'); setTimeout(() => go('gateAnswer', 'rise'), reduced ? 0 : 420); },
  'clock-out'(el) { if (ui.gate) return; ripple(el); startGate('out'); setTimeout(() => go('gateAnswer', 'rise'), reduced ? 0 : 420); },
  resume() { const P = me(), slot = P.phase === 'gate-in' ? 'in' : 'out'; ui.gate = { slot, reg: regOf(S.day, slot), a: null, g: null, time: P.times[S.day][slot] }; go('gateAnswer', 'rise'); },
  answer(el) {
    if (!ui.gate || ui.gate.lock) return;
    ui.gate.a = +el.dataset.i; ui.gate.lock = true;
    $$('.opt', host.lastElementChild).forEach(b => b.setAttribute('aria-pressed', b === el));
    setTimeout(() => go('gateGuess', 'push'), reduced ? 0 : 260);
  },
  guess(el) {
    ui.gate.g = +el.dataset.i;
    const scr = host.lastElementChild;
    $$('.opt', scr).forEach(b => b.setAttribute('aria-pressed', b === el));
    $('[data-act=gate-complete]', scr).disabled = false;
  },
  'gate-back'() { ui.gate.lock = false; go('gateAnswer', 'pop'); },
  'gate-complete'() {
    if (!ui.gate || ui.gate.g == null) return;
    const r = completeGate();
    ui.done = { slot: ui.gate.slot, time: ui.gate.time, made: r.made, pebbles: r.pebbles, prev: r.prev };
    ui.gate = null; save(); go('done', 'rise');
  },
  'done-close'() { ui.done = null; go('today', 'fade'); },
  'to-pebbles'() { ui.done = null; go('pebbles', 'fade'); },
  'to-pebbles-back'() { go('pebbles', 'pop'); },
  'tab-today'() { if (ui.screen !== 'today') go('today', 'tab'); },
  'tab-today-back'() { go('today', 'pop'); },
  'tab-pebbles'() {
    if (ui.screen === 'pebbles') return;
    S.gifts.forEach(g => { if (g.from === S.viewer && g.reply) g.replySeen = true; }); save();
    go('pebbles', ui.screen === 'today' ? 'tab' : 'fade');
  },
  history() { ui.histOpen = -2; go('history', 'push'); },
  hist(el) { const r = +el.dataset.r; ui.histOpen = ui.histOpen === r ? -2 : r; const li = el.parentElement; const open = ui.histOpen === r; $$('.hist li', host.lastElementChild).forEach(x => x.classList.remove('open')); if (open) { li.classList.add('open'); animateBars($('.result', li), 120); } el.setAttribute('aria-expanded', open); },
  give() { ui.give = { to: null, item: null, q: '', chip: null, text: '' }; go('givePick', 'push'); },
  'give-cancel'() { go('pebbles', 'pop'); },
  'pick-person'(el) { ui.give.to = el.dataset.id; ui.give.item = null; go('givePick', 'push'); },
  'change-person'() { ui.give.to = null; go('givePick', 'pop'); },
  'pick-item'(el) { ui.give.item = el.dataset.id; $$('.item', host.lastElementChild).forEach(b => b.setAttribute('aria-pressed', b === el)); $('[data-act=give-next]', host.lastElementChild).disabled = false; },
  'give-next'() { go('giveMsg', 'push'); },
  'give-back'() { go('givePick', 'pop'); },
  'pick-chip'(el) { const i = +el.dataset.i; ui.give.chip = ui.give.chip === i ? null : i; $$('.chipb', host.lastElementChild).forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === ui.give.chip)); },
  send() {
    if (!ui.give) return;
    const g = ui.give, it = itemById(g.item), P = me();
    P.towers -= towersFor(it);
    S.gifts.push({ id: 'g' + Date.now(), from: S.viewer, to: g.to, item: g.item, chip: g.chip, text: g.text.trim(), day: S.day, seen: false, reply: null, replySeen: false });
    ui.give = null; save(); go('sent', 'rise');
  },
  'open-gift'(el) {
    const id = el.dataset.id; ui.recv = id; ui.reply = { chip: null, text: '' };
    const g = S.gifts.find(x => x.id === id); if (g) { g.seen = true; save(); }
    const b = $('.banner'); if (b) b.classList.remove('show');
    go('received', 'push');
  },
  'reply-chip'(el) { const i = +el.dataset.i; ui.reply.chip = ui.reply.chip === i ? null : i; const scr = host.lastElementChild; $$('.chipb', scr).forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === ui.reply.chip)); $('[data-act=send-reply]', scr).disabled = ui.reply.chip == null && !ui.reply.text.trim(); },
  'send-reply'() {
    const g = S.gifts.find(x => x.id === ui.recv), it = itemById(g.item);
    const chip = ui.reply.chip != null ? replies(it)[ui.reply.chip] : '', text = ui.reply.text.trim();
    g.reply = [chip, text].filter(Boolean).join(' '); save();
    const scr = host.lastElementChild; const box = $('.fu:last-child', scr);
    if (box) { box.innerHTML = `<div class="replied">내 화답 · “${esc(g.reply)}”<small>${esc(who(g.from).name)}님에게 이 한마디만 전해져요</small></div>`; anim(box.firstElementChild, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 420 }); }
    renderDemo();
  },
  coupon(el) { el.textContent = 'A7K2-19Q4'; el.disabled = true; },
  settings() { sheet(settingsHTML()); },
  'sheet-close'() { closeSheet(); },
  font(el) { S.large = el.dataset.v === '1'; save(); app.classList.toggle('large', S.large); $('.sheet').innerHTML = settingsHTML(); },
  noop() {},
  // demo panel
  'demo-open'() { $('#demo').classList.add('open'); },
  'demo-close'() { $('#demo').classList.remove('open'); },
  'next-day'() { nextDay(); ui.done = null; go('today', 'fade'); },
  fast() { fastForward(); ui.done = null; S.viewer = 'lucy'; go('pebbles', 'fade'); },
  'as-lucy'() { switchViewer('lucy'); },
  'as-julie'() { switchViewer('julie'); },
  reset() { S = fresh(); save(); Object.assign(ui, { gate: null, done: null, give: null, recv: null }); app.classList.remove('large'); go('onboard', 'fade'); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.give.q = e.target.value; $('[data-role=people]').innerHTML = peopleList(ui.give.q); }
  if (e.target.id === 'msg') { ui.give.text = e.target.value; $('[data-role=count]', host.lastElementChild).textContent = `${e.target.value.length}/40`; }
  if (e.target.id === 'rmsg') { ui.reply.text = e.target.value; $('[data-act=send-reply]', host.lastElementChild).disabled = ui.reply.chip == null && !ui.reply.text.trim(); }
});

/* ── demo panel ──────────────────────────────────────────── */
function hint() {
  const P = S.p.lucy, gift = S.gifts.find(g => g.to === 'julie');
  if (!S.onboarded) return ['시작', '앱에서 ‘시작하기’를 눌러 보세요.'];
  if (S.viewer === 'julie') {
    if (gift && !gift.reply) return ['받는 쪽', 'Lucy가 건넨 조약돌이 와 있어요. 열어 보고, 원하면 짧게 화답해 보세요.'];
    if (gift && gift.reply) return ['다시 Lucy로', '화답을 보냈어요. Lucy로 바꾸면 화답이 도착해 있어요.'];
    return ['받는 쪽', 'Lucy가 탑을 모아 Julie에게 건네면 여기로 도착해요.'];
  }
  if (gift && !gift.seen) return ['건넸어요', '‘Julie로 보기’를 눌러 받는 쪽 화면을 보세요.'];
  if (S.day === 5) return ['주말', '주말에는 질문이 없어요. ‘월요일 아침으로’를 누르면 금요일 퇴근 질문의 결과가 열려요.'];
  if (P.towers > 0 && !gift) return ['탑 완성', '조약돌 탭에서 ‘선물 고르기’를 눌러 Julie에게 건네 보세요. 사내 카페는 반값이에요.'];
  if (P.phase === 'before') return ['출근', '‘출근하기’를 누르면 오늘의 질문이 나와요. 답하고 예상해야 출근이 완료돼요.'];
  if (P.phase === 'in') return ['근무 중', '‘퇴근하기’를 누르면 시간이 퇴근 시각으로 넘어가요.'];
  if (P.phase === 'out' && S.day < 6) return ['퇴근', '‘다음 날 아침으로’를 눌러 하루를 넘겨 보세요. 한 번에 보려면 ‘이번 주 빠르게 채우기’.'];
  if (P.phase.startsWith('gate')) return ['질문 중', '답을 고르고, 다른 사람들이 가장 많이 고른 답을 예상해 보세요.'];
  return ['끝', '시연은 여기까지예요. ‘처음부터’로 다시 볼 수 있어요.'];
}
function renderDemo() {
  const P = S.p.lucy, [h, txt] = hint();
  const nextLabel = S.day < 4 ? '다음 날 아침으로' : S.day === 4 ? '주말로' : S.day === 5 ? '월요일 아침으로' : '다음 날 없음';
  const week = [0, 1, 2, 3, 4].map(d => `<div class="d${S.day === d ? ' today' : ''}"><span>${'월화수목금'[d]}</span><span class="pips">${['in', 'out'].map(s => { const r = regOf(d, s); return `<i class="${P.done.includes(r) ? 'done' : ''}${S.day === d && ((s === 'in' && P.phase === 'before') || (s === 'out' && P.phase === 'in')) ? ' now' : ''}" title="${s === 'in' ? '출근' : '퇴근'}"></i>`; }).join('')}</span></div>`).join('');
  $('#demo').innerHTML = `
    <button class="demo-close" data-act="demo-close">닫기</button>
    <div><p class="kicker">시연 패널 · 앱 밖의 조작</p><h2>조약돌</h2></div>
    <p class="hint-box"><b>${h}</b>${txt}</p>
    <div><p class="kicker" style="margin-bottom:8px;text-transform:none;letter-spacing:.02em">Lucy의 한 주 · 출근 / 퇴근</p><div class="week">${week}</div></div>
    <div class="seg" role="group" aria-label="보는 사람"><button data-act="as-lucy" aria-pressed="${S.viewer === 'lucy'}">Lucy · 재무팀</button><button data-act="as-julie" aria-pressed="${S.viewer === 'julie'}">Julie · 마케팅팀</button></div>
    <div class="demo-actions">
      <button class="dbtn main" data-act="next-day" ${S.day >= 6 || !S.onboarded ? 'disabled' : ''}>${nextLabel}<span>→</span></button>
      <button class="dbtn" data-act="fast" ${P.done.includes(9) ? 'disabled' : ''}>이번 주 빠르게 채우기<span>»</span></button>
      <button class="dbtn quiet" data-act="reset">처음부터 다시 보기</button>
    </div>
    <details><summary>이 프로토타입에 대해</summary><p>2024 ICISTS × KAIST 해커페어 「조약돌」을 2026년에 다시 설계한 화면입니다. 회사는 가상의 A사(약 210명), 응답 분포는 예시 값입니다. 진행 상황은 이 브라우저에만 저장돼요.</p></details>`;
}

/* ── scale the device to fit the window ──────────────────── */
function fit() {
  const k = Math.min(1, (innerHeight - 64) / 868, (innerWidth - 32) / 414);
  document.documentElement.style.setProperty('--k', Math.max(.6, k).toFixed(3));
}
addEventListener('resize', fit); fit();

/* ── boot ────────────────────────────────────────────────── */
app.classList.toggle('large', !!S.large);
go(S.onboarded ? 'today' : 'onboard', 'fade');
})();
</script>
