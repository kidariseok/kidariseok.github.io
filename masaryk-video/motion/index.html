<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Masaryk University — Exchange Decision</title>
<style>
@font-face { font-family: "Pretendard"; font-weight: 300; src: url(assets/fonts/Pretendard-Light.woff2) format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 400; src: url(assets/fonts/Pretendard-Regular.woff2) format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 500; src: url(assets/fonts/Pretendard-Medium.woff2) format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 600; src: url(assets/fonts/Pretendard-SemiBold.woff2) format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; src: url(assets/fonts/Pretendard-Bold.woff2) format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 800; src: url(assets/fonts/Pretendard-ExtraBold.woff2) format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-style: normal; src: url(assets/fonts/instrument-serif-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
:root {
  --ink: #0A0C11; --ink2: #151922; --paper: #F3F0E9; --paper2: #E7E2D7; --card: #FFFFFF;
  --mid: #7C808A; --muni: #0000DC; --muni-l: #5563FF; --red: #E0453E;
  --line-l: rgba(10,12,17,.12); --line-d: rgba(255,255,255,.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: "Pretendard", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
.scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; visibility: hidden; }
.scene.dark { background: var(--ink); color: #fff; }
.scene.light { background: var(--paper); color: var(--ink); }
.scene * { will-change: transform, opacity; }
.mask { overflow: hidden; }
.mask > div { will-change: transform; white-space: nowrap; }
.mono { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .14em; font-weight: 500; font-size: 20px; }
.serif { font-family: "Instrument Serif", "Pretendard", serif; font-weight: 400; letter-spacing: -0.01em; }
.it { font-style: italic; }
.kr { font-family: "Pretendard", sans-serif; letter-spacing: -0.02em; }
.muni { color: var(--muni); }
.dark .muni { color: var(--muni-l); }
.dim { color: var(--mid); }
.center { text-align: center; }
.abs { position: absolute; }
/* chrome */
#chrome { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
.chap { position: absolute; left: 96px; top: 60px; display: flex; gap: 18px; align-items: center; font-size: 18px; }
.chap .n { color: var(--muni); font-weight: 700; }
.chap .bar { width: 36px; height: 1px; background: currentColor; opacity: .5; }
.prog { position: absolute; left: 96px; bottom: 54px; width: 1728px; height: 2px; background: rgba(127,127,127,.18); }
.prog > div { height: 100%; width: 100%; background: currentColor; transform-origin: 0 0; opacity: .55; }
#wipe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--muni); visibility: hidden; }
/* map */
.mapview { position: absolute; }
.pin { position: absolute; will-change: transform, opacity; }
.pin-dot { position: absolute; border-radius: 50%; }
.pin-ring { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border: 2px solid; border-radius: 50%; transform: translate(-50%,-50%); opacity: 0; }
.pin-label { position: absolute; font-size: 17px; white-space: nowrap; letter-spacing: .12em; }
/* cards */
.card { position: absolute; background: var(--card); border-radius: 22px; box-shadow: 0 1px 0 rgba(10,12,17,.04), 0 18px 50px -24px rgba(10,12,17,.35); }
.frame { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line-l); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.tag { position: absolute; padding: 8px 14px; border-radius: 8px; font-size: 17px; white-space: nowrap; }
/* check rows */
.crow { position: absolute; display: flex; align-items: center; gap: 18px; white-space: nowrap; }
.cmark { width: 30px; height: 30px; flex: none; }
.cmark svg { display: block; }
.clab { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .12em; font-size: 21px; font-weight: 500; }
.csub { font-size: 21px; color: var(--mid); letter-spacing: -0.01em; }
/* stamp */
.stamp { position: absolute; padding: 10px 22px; border: 4px solid var(--red); color: var(--red); border-radius: 10px; font-family: "Pretendard"; font-weight: 800; font-size: 46px; letter-spacing: .02em; white-space: nowrap; transform-origin: 50% 50%; }
.stamp.hold { border-color: var(--ink); color: var(--ink); font-size: 30px; font-family: "JetBrains Mono"; font-weight: 700; letter-spacing: .12em; }
/* calendar */
.cal { position: absolute; }
.cal-m { position: absolute; top: 0; font-size: 15px; text-align: center; color: var(--mid); letter-spacing: .08em; }
.cal-year { position: absolute; font-size: 15px; color: var(--ink); font-weight: 700; padding-left: 6px; }
.cal-grid { position: absolute; width: 1px; background: var(--line-l); }
.cal-grid.yr { background: rgba(10,12,17,.35); }
.cal-label { position: absolute; width: 210px; text-align: right; font-size: 22px; font-weight: 600; white-space: nowrap; }
.cal-label small { display: block; font-family: "JetBrains Mono"; font-size: 14px; letter-spacing: .12em; color: var(--mid); font-weight: 500; margin-top: 4px; }
.cal-bar { position: absolute; height: 52px; border-radius: 10px; background: var(--ink); color: #fff; overflow: hidden; }
.cal-bar.blue { background: var(--muni); }
.cal-bar.grey { background: #B9B4A8; }
.cal-bar.red { background: var(--red); }
.cal-bar-text { position: absolute; left: 16px; top: 16px; font-size: 15px; white-space: nowrap; }
.cal-mark { position: absolute; width: 0; }
.cal-mark-line { position: absolute; left: -1px; top: 0; width: 2px; background: var(--ink); }
.cal-mark-label { position: absolute; left: 10px; top: -30px; font-size: 15px; white-space: nowrap; font-weight: 700; }
.cal-band { position: absolute; }
.cal-band.window { background: rgba(0,0,220,.10); box-shadow: inset 0 0 0 2px rgba(0,0,220,.45); border-radius: 8px; }
.cal-band.gap { background: repeating-linear-gradient(135deg, rgba(224,69,62,.20) 0 8px, rgba(224,69,62,.04) 8px 16px); border-radius: 8px; }
.cal-band.clash { background: rgba(224,69,62,.22); box-shadow: inset 0 0 0 2px var(--red); border-radius: 8px; }
.cal-band-label { position: absolute; left: 10px; bottom: 10px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.gauge { position: absolute; }
.gauge-lab { position: absolute; font-size: 15px; color: var(--mid); }
/* browser */
.browser { position: absolute; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(10,12,17,.45), 0 0 0 1px rgba(10,12,17,.06); }
.skel { position: absolute; height: 14px; border-radius: 7px; background: #ECE8E0; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="assets/europe.js"></script>
<script src="timeline.js"></script>
<script src="lib.js"></script>
<script src="components.js"></script>
<script src="scenes_a.js"></script>
<script src="scenes_b.js"></script>
<script src="scenes_c.js"></script>
<script src="main.js"></script>
</body>
</html>
